name: Build and Release FFmpeg

on:
  workflow_dispatch:

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.determine_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Get FFmpeg Target Version
        id: determine_version
        run: |
          source config.sh
          VERSION="$VIDRA_FFMPEG_VERSION"
          echo "La versión para release es: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: check_version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: x86_64
          - target_os: windows
            target_arch: x86_64
          - target_os: android
            target_arch: arm64-v8a
          - target_os: android
            target_arch: armeabi-v7a
          - target_os: android
            target_arch: x86
          - target_os: android
            target_arch: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compilar FFmpeg (vía Docker)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Iniciando contenedor para compilar ${{ matrix.target_os }} ${{ matrix.target_arch }}..."
          docker compose run --rm ffmpeg-builder ${{ matrix.target_os }} ${{ matrix.target_arch }}

      - name: Zip Assets
        run: |
          mkdir -p release_assets
          zip -9 -j release_assets/ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: release_assets/ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip

  release:
    name: Publish Release
    needs: [check_version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Prepare Checksums
        working-directory: release_assets
        run: |
          sha256sum ffmpeg-* > SHA2-256SUMS
          sha512sum ffmpeg-* > SHA2-512SUMS
      
      - name: Generate GPG Signatures
        working-directory: release_assets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output SHA2-256SUMS.sig SHA2-256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output SHA2-512SUMS.sig SHA2-512SUMS

      - name: Generar Fechas y Notas de la Release en Markdown
        id: build_notes
        env:
          VERSION: ${{ needs.check_version.outputs.target_version }}
        run: |
          source config.sh
          cat <<EOF > release_notes.md
          # 🚀 FFmpeg Multi-platform Release (v$VERSION)

          Compilación nativa y automatizada de los binarios del motor **FFmpeg** utilizando un entorno aislado en Docker.

          ### 📦 Información del Motor
          - **Versión/Commit de FFmpeg Utilizado:** \`$FFMPEG_VERSION\`
          - **Origen del Código Fuente:** [$FFMPEG_REPO](https://github.com/$FFMPEG_REPO)
          - **Fecha de Compilación:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ### 🛠️ Detalles de los Ejecutables Publicados

          - **Linux x86_64:** \`ffmpeg\`, \`ffprobe\`
          - **Windows x86_64:** \`ffmpeg.exe\`, \`ffprobe.exe\`
          - **Android arm64-v8a:** \`ffmpeg\`, \`ffprobe\`
          - **Android armeabi-v7a:** \`ffmpeg\`, \`ffprobe\`
          - **Android x86:** \`ffmpeg\`, \`ffprobe\`
          - **Android x86_64:** \`ffmpeg\`, \`ffprobe\`

          ### 🔒 Verificación de Integridad (SHA2-256 Checksums)
          \`\`\`text
          $(cat release_assets/SHA2-256SUMS)
          \`\`\`

          ### 🔒 Verificación de Integridad (SHA2-512 Checksums)
          \`\`\`text
          $(cat release_assets/SHA2-512SUMS)
          \`\`\`          
          EOF

      - name: Publicar Release y Subir Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_version.outputs.target_version }}
          name: "FFmpeg v${{ needs.check_version.outputs.target_version }}"
          body_path: release_notes.md
          files: release_assets/*
