name: Build and Release FFmpeg

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.determine_version.outputs.version }}
      should_build: ${{ steps.check_release.outputs.should_build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Get FFmpeg Target Version
        id: determine_version
        run: |
          source config.sh
          VERSION="$VIDRA_FFMPEG_VERSION"
          echo "La versión para release es: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Release Assets Exist
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.determine_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_INFO=$(gh release view "$VERSION" --repo "$REPO" --json assets 2>/dev/null || echo "not_found")

          if [ "$RELEASE_INFO" == "not_found" ]; then
            echo "La release $VERSION no existe. Se lanzará la compilación."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
            if [ "$ASSET_COUNT" -gt 0 ]; then
              echo "✅ La release $VERSION ya existe y contiene $ASSET_COUNT assets. Omitiendo compilación redundante."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "⚠️ La release $VERSION existe pero no contiene archivos (assets). Se lanzará la compilación."
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: check_version
    if: needs.check_version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: x86_64
          - target_os: windows
            target_arch: x86_64
          - target_os: android
            target_arch: arm64-v8a
          - target_os: android
            target_arch: armeabi-v7a
          - target_os: android
            target_arch: x86
          - target_os: android
            target_arch: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compilar FFmpeg (vía Docker)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Iniciando contenedor para compilar ${{ matrix.target_os }} ${{ matrix.target_arch }}..."
          docker compose run --rm ffmpeg-builder ${{ matrix.target_os }} ${{ matrix.target_arch }}

      - name: Zip Assets
        run: |
          mkdir -p release_assets
          zip -9 -j release_assets/ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: release_assets/ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip

  release:
    needs: [check_version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Prepare Checksums
        run: |
          cd release_assets
          sha256sum ffmpeg-* > SHA2-256SUMS
          sha512sum ffmpeg-* > SHA2-512SUMS

      - name: Generar Fechas y Notas de la Release en Markdown
        id: build_notes
        env:
          VERSION: ${{ needs.check_version.outputs.target_version }}
        run: |
          source config.sh
          cat <<EOF > release_notes.md
          # 🚀 FFmpeg Multi-platform Release (v$VERSION)

          Compilación nativa y automatizada de los binarios del motor **FFmpeg** utilizando un entorno aislado en Docker.

          ### 📦 Información del Motor
          - **Versión/Commit de FFmpeg Utilizado:** \`$FFMPEG_VERSION\`
          - **Origen del Código Fuente:** [https://github.com/$FFMPEG_REPO]($FFMPEG_REPO)
          - **Fecha de Compilación:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ### 🛠️ Detalles de los Ejecutables Publicados

          - **Linux x86_64:** \`ffmpeg\`, \`ffprobe\`
          - **Windows x86_64:** \`ffmpeg.exe\`, \`ffprobe.exe\`
          - **Android arm64-v8a:** \`ffmpeg\`, \`ffprobe\`
          - **Android armeabi-v7a:** \`ffmpeg\`, \`ffprobe\`
          - **Android x86:** \`ffmpeg\`, \`ffprobe\`
          - **Android x86_64:** \`ffmpeg\`, \`ffprobe\`

          ### 🔒 Verificación de Integridad (SHA2-256 Checksums)
          \`\`\`text
          $(cat release_assets/SHA2-256SUMS)
          \`\`\`

          ⚠️ *Nota: Los archivos disponen de certificación de procedencia criptográfica de GitHub (Artifact Attestations). Puedes verificar su validez usando la extensión CLI de GitHub.*
          EOF
      - name: Certificar Procedencia de los Assets (Attestation de Verificación)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release_assets/ffmpeg-*"

      - name: Publicar Release y Subir Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check_version.outputs.target_version }}
          REPO: ${{ github.repository }}
        run: |
          echo "Creando o actualizando Release en GitHub para la versión v$VERSION..."
          gh release create "$VERSION" \
            --title "v$VERSION" \
            --notes-file release_notes.md || echo "El release ya existe, procediendo a subir assets..."

          echo "Subiendo archivos crudos y sumas de verificación..."
          gh release upload "$VERSION" release_assets/* --clobber
